aid: azumio
name: Azumio
description: >-
  Azumio is an AI-driven digital health company whose consumer apps (Argus,
  Instant Heart Rate, Fitness Buddy, Glucose Buddy, Sleep Time, Calorie Mama)
  have been downloaded more than 100 million times. Beyond its apps, Azumio
  offers developer APIs and SDKs built on its deep-learning and digital-biomarker
  technology: the Calorie Mama Food Recognition API (identify food from a photo
  and return calories, macronutrients, and full nutrition), the Azumio 360
  tracking API/SDK for diet, fitness and sleep, and diabetes-focused APIs
  including an AI Instant Diabetes Test biomarker and blood-glucose management.
  The flagship, publicly documented developer product is the Calorie Mama Food
  Recognition API, a 3scale-gateway REST API using API-key authentication.
